<!DOCTYPE html>
<html>
<head>
    <meta>
    <title>Task 6</title>
</head>
<body>
    <script>
        let answer = confirm ("Should I calculate the square root?");

        if (answer) {
            let number = Number (prompt("Enter a number:"));

            if (number < 0) {
                document.body.innerHTML = "The square root of negative number is not defined";
            } else {
                document.body.innerHTML = "Square root: " + Math.sqrt(number);
            }
        } else {
            document.body.innerHTML = "The square root is not calculated.";
        }
    </script>
</body>
</html>
