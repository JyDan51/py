<!DOCTYPE html>
<html>
<head>
    <meta>
    <title>Task 3</title>
</head>
<body>
    <script>
        let a = Number (prompt ("First number:"));
        let b = Number (prompt ("Second number:"));
        let c = Number (prompt ("Third number:"));
        let sum = a + b + c;
        let product = a * b * c;
        let average = sum / 3;
 
        document.body.innerHTML = "Sum: " + sum + "<br>";
        document.body.innerHTML += "Product: " + product + "<br>";
        document.body.innerHTML += "Average: " + average;
    </script>
</body> 
</html>
