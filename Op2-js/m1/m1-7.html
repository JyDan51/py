<!DOCTYPE html>
<html>
<head>
    <meta>
    <title>Task 7</title>
</head>
<body>
    <script>
        let dice = Number (prompt ("How many dice?"));
        let sum = 0;

        for (let i = 0; i < dice; i++) {
            let roll = Math.floor(Math.random() * 6) + 1;
            sum = sum + roll;
        }

        document.body.innerHTML = "Sum of dice: " + sum;
    </script>
</body>
</html>
